<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1220">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="manifest" href="manifest.webmanifest">
<title>GCash Tracker — Add Record</title>
<style>
  :root {
    --bg: #0b1220;
    --panel: #131c2e;
    --panel-2: #1b2740;
    --line: #26334d;
    --text: #eef2f9;
    --muted: #94a3b8;
    --accent: #2f7cf6;
    --accent-soft: #17325e;
    --good: #34d399;
    --bad: #f87171;
    --warn: #fbbf24;
    --radius: 14px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--text); }
  body {
    font: 16px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) calc(env(safe-area-inset-bottom) + 96px);
    min-height: 100vh;
  }
  .wrap { max-width: 560px; margin: 0 auto; padding: 14px 14px 0; }
  h1 { font-size: 19px; margin: 4px 0 14px; letter-spacing: .2px; }
  .row { display: flex; gap: 10px; align-items: center; }
  .spread { justify-content: space-between; }
  .muted { color: var(--muted); }
  .small { font-size: 13px; }
  .tiny { font-size: 12px; }

  .card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; margin-bottom: 12px; }

  /* balances */
  .balances { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .bal { background: var(--panel-2); border-radius: 12px; padding: 10px 12px; }
  .bal .label { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .6px; }
  .bal .value { font-size: 20px; font-weight: 650; margin-top: 2px; font-variant-numeric: tabular-nums; }
  .bal .value.neg { color: var(--bad); }

  label { display: block; font-size: 13px; color: var(--muted); margin: 0 0 6px; text-transform: uppercase; letter-spacing: .6px; }
  input, select, textarea, button { font: inherit; color: inherit; font-family: inherit; }
  input, select, textarea {
    width: 100%; background: var(--panel-2); border: 1px solid var(--line);
    border-radius: 12px; padding: 13px 14px; outline: none;
  }
  input:focus, select:focus, textarea:focus { border-color: var(--accent); }
  textarea { min-height: 64px; resize: vertical; }
  .amount-input { font-size: 30px; font-weight: 700; letter-spacing: .5px; padding: 12px 14px 12px 40px; font-variant-numeric: tabular-nums; }
  .amount-wrap { position: relative; }
  .peso { position: absolute; left: 15px; top: 50%; transform: translateY(-50%); font-size: 24px; color: var(--muted); }

  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip {
    border: 1px solid var(--line); background: var(--panel-2); border-radius: 999px;
    padding: 9px 14px; cursor: pointer; font-size: 14px;
  }
  .chip:active { transform: scale(.97); }
  .seg { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .seg button {
    border: 1px solid var(--line); background: var(--panel-2); border-radius: 12px;
    padding: 13px 6px; cursor: pointer; font-size: 15px;
  }
  .seg button[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); font-weight: 600; }

  .field { margin-bottom: 14px; }
  .field:last-child { margin-bottom: 0; }
  #setup .btn { margin-top: 18px; }

  .pair { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .signed { display: flex; gap: 6px; }
  .signed input { padding-left: 10px; font-variant-numeric: tabular-nums; }
  .sign {
    flex: 0 0 46px; border: 1px solid var(--line); background: var(--panel-2);
    border-radius: 12px; font-size: 19px; font-weight: 700; cursor: pointer;
  }
  .sign[data-sign="-"] { color: var(--bad); border-color: var(--bad); }
  .sign[data-sign="+"] { color: var(--good); border-color: var(--good); }
  .label-row { display: flex; justify-content: space-between; align-items: baseline; }

  .entry {
    display: flex; justify-content: space-between; gap: 12px; width: 100%; text-align: left;
    background: none; border: none; border-bottom: 1px solid var(--line);
    padding: 12px 2px; cursor: pointer; color: var(--text);
  }
  .entry:last-child { border-bottom: none; }
  .entry:active { background: var(--panel-2); }
  .entry .who { display: block; font-size: 15px; }
  .entry .when { display: block; font-size: 12px; color: var(--muted); margin-top: 3px; }
  .entry .money { text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .entry .money .amount { font-size: 15px; font-weight: 600; }

  .preview { background: var(--panel-2); border-radius: 12px; padding: 11px 13px; font-size: 14px; }
  .preview b { font-variant-numeric: tabular-nums; }

  .submit-bar {
    position: fixed; left: 0; right: 0; bottom: 0; padding: 12px 14px calc(12px + env(safe-area-inset-bottom));
    background: linear-gradient(to top, var(--bg) 70%, transparent);
  }
  .submit-bar .inner { max-width: 560px; margin: 0 auto; }
  .btn {
    width: 100%; border: none; border-radius: 14px; padding: 16px; font-size: 17px; font-weight: 650;
    background: var(--accent); color: #fff; cursor: pointer;
  }
  .btn[disabled] { opacity: .55; }
  .btn.secondary { background: var(--panel-2); border: 1px solid var(--line); color: var(--text); font-weight: 500; font-size: 15px; padding: 12px; }
  .btn.ghost { background: transparent; border: 1px solid var(--line); }

  .toast {
    position: fixed; left: 50%; transform: translateX(-50%); bottom: 92px; width: calc(100% - 28px); max-width: 532px;
    background: var(--panel-2); border: 1px solid var(--line); border-left: 4px solid var(--accent);
    border-radius: 12px; padding: 12px 14px; font-size: 14px; box-shadow: 0 10px 30px rgba(0,0,0,.45);
  }
  .toast.ok { border-left-color: var(--good); }
  .toast.err { border-left-color: var(--bad); }
  .toast.warn { border-left-color: var(--warn); }
  [hidden] { display: none !important; }
  a { color: var(--accent); }
  .link { background: none; border: none; color: var(--accent); padding: 0; font-size: 13px; cursor: pointer; text-decoration: underline; }
</style>
</head>
<body>

<!-- ------------------------------------------------------------ setup ---->
<section id="setup" class="wrap" hidden>
  <h1 id="setupTitle">Connect your tracker</h1>
  <div class="card">
    <div id="setupPin" hidden>
      <div class="field">
        <label for="setupPinInput">PIN</label>
        <input id="setupPinInput" type="password" inputmode="text" autocomplete="off">
      </div>
    </div>

    <div id="setupDirect" hidden>
      <div class="field">
        <label for="setupUrl">Apps Script Web App URL</label>
        <input id="setupUrl" type="url" inputmode="url" autocomplete="off" placeholder="https://script.google.com/macros/s/&#8230;/exec">
      </div>
      <div class="field">
        <label for="setupSecret">Shared secret (optional)</label>
        <input id="setupSecret" type="text" autocomplete="off" placeholder="Must match SETTINGS.sharedSecret">
      </div>
    </div>

    <button class="btn" id="setupSave">Connect</button>
    <p class="small muted" id="setupHelp" style="margin-bottom:0"></p>
  </div>
</section>

<!-- ------------------------------------------------------------- form ---->
<section id="app" class="wrap" hidden>
  <div class="row spread">
    <h1 id="sheetTitle">Add record</h1>
    <div class="row" style="gap:14px">
      <button class="link" id="openRecent">Recent</button>
      <button class="link" id="openSettings">Settings</button>
    </div>
  </div>

  <div class="card">
    <div class="balances">
      <div class="bal"><div class="label">Cash on hand</div><div class="value" id="balCash">—</div></div>
      <div class="bal"><div class="label">E-money</div><div class="value" id="balEmoney">—</div></div>
    </div>
    <div class="row spread small muted" style="margin-top:10px">
      <span id="sheetLine">Loading…</span>
      <button class="link" id="refresh">Refresh</button>
    </div>
  </div>

  <div class="card" id="editBanner" hidden>
    <div class="row spread">
      <span class="small">Editing <b id="editRowLabel"></b></span>
      <button class="link" id="cancelEdit">Cancel</button>
    </div>
    <button type="button" class="btn secondary" id="deleteRecord" style="margin-top:10px">Delete this record</button>
  </div>

  <form id="form" class="card" novalidate>
    <div class="field">
      <label>Type</label>
      <div class="seg" id="typeSeg"></div>
    </div>

    <div class="field">
      <label for="amount">Amount</label>
      <div class="amount-wrap">
        <span class="peso">₱</span>
        <input id="amount" class="amount-input" type="text" inputmode="decimal" autocomplete="off" placeholder="0">
      </div>
      <div class="chips" style="margin-top:8px" id="amountChips"></div>
    </div>

    <div class="field">
      <div class="label-row">
        <label style="margin-bottom:6px">Change written to the sheet</label>
        <button type="button" class="link" id="autoChanges" style="margin-bottom:6px">Recalculate</button>
      </div>
      <div class="pair">
        <div>
          <div class="tiny muted" style="margin-bottom:5px">Cash</div>
          <div class="signed">
            <button type="button" class="sign" id="cashSign" data-sign="+" aria-label="Cash change direction">+</button>
            <input id="cashChange" type="text" inputmode="decimal" autocomplete="off" aria-label="Cash change">
          </div>
        </div>
        <div>
          <div class="tiny muted" style="margin-bottom:5px">E-money</div>
          <div class="signed">
            <button type="button" class="sign" id="emoneySign" data-sign="-" aria-label="E-money change direction">&#8722;</button>
            <input id="emoneyChange" type="text" inputmode="decimal" autocomplete="off" aria-label="E-money change">
          </div>
        </div>
      </div>
    </div>

    <div class="field">
      <label for="customer">Customer / Ref</label>
      <input id="customer" type="text" list="customerList" autocomplete="off" placeholder="Optional">
      <datalist id="customerList"></datalist>
      <div class="chips" style="margin-top:8px" id="customerChips"></div>
    </div>

    <div class="field">
      <label for="date">Date</label>
      <div class="row">
        <input id="date" type="date">
        <button type="button" class="chip" id="todayBtn">Today</button>
      </div>
    </div>

    <div class="field">
      <label for="notes">Notes</label>
      <textarea id="notes" placeholder="Optional"></textarea>
    </div>

    <div class="preview" id="preview">Enter an amount to see the fee.</div>
  </form>

  <div class="card" id="queueCard" hidden>
    <div class="row spread">
      <span class="small"><b id="queueCount">0</b> record(s) waiting to send</span>
      <button class="btn secondary" style="width:auto" id="queueRetry">Retry now</button>
    </div>
    <button class="link" id="queueClear" style="margin-top:8px">Discard them</button>
  </div>
</section>

<!-- ----------------------------------------------------------- recent ---->
<section id="recent" class="wrap" hidden>
  <div class="row spread">
    <h1>Recent records</h1>
    <button class="link" id="closeRecent">Done</button>
  </div>
  <div class="card">
    <div id="recentList" class="small muted">Loading…</div>
  </div>
</section>

<!-- --------------------------------------------------------- settings ---->
<section id="settings" class="wrap" hidden>
  <div class="row spread">
    <h1>Settings</h1>
    <button class="link" id="closeSettings">Done</button>
  </div>
  <div class="card">
    <div class="field">
      <label for="cfgSheet">Target sheet</label>
      <select id="cfgSheet"></select>
      <p class="tiny muted" style="margin:6px 0 0">Auto picks the sheet whose latest entry is in the same month as the record.</p>
    </div>
    <div class="field" id="cfgPinField">
      <label for="cfgPin">PIN</label>
      <input id="cfgPin" type="password" autocomplete="off">
      <p class="tiny muted" id="cfgConnection" style="margin:6px 0 0"></p>
    </div>
    <div class="field" id="cfgDirectFields">
      <label for="cfgUrl">Web App URL</label>
      <input id="cfgUrl" type="url" inputmode="url" autocomplete="off">
      <label for="cfgSecret" style="margin-top:12px">Shared secret</label>
      <input id="cfgSecret" type="text" autocomplete="off">
    </div>
    <button class="btn" id="cfgSave">Save</button>
    <button class="btn secondary" id="cfgForget" style="margin-top:10px">Disconnect this phone</button>
  </div>
</section>

<div id="toast" class="toast" hidden></div>

<div class="submit-bar" id="submitBar" hidden>
  <div class="inner"><button class="btn" id="submit">Add record</button></div>
</div>

<script>
(function () {
  'use strict';

  var STORE = 'gcashForm.settings';
  var QUEUE = 'gcashForm.queue';
  // Same-origin serverless proxy. It holds the script URL and the Apps Script
  // secret as environment variables, so neither ever reaches the browser.
  var PROXY = 'api/log';
  var AMOUNT_CHIPS = [50, 100, 300, 500, 1000, 2000, 5000];
  var FALLBACK_TYPES = ['Cash In', 'Cash Out', 'Fund In', 'Load', 'Expense'];

  var $ = function (id) { return document.getElementById(id); };
  var settings = load(STORE, { mode: '', url: '', secret: '', pin: '', sheet: '' });
  var config = null;
  var selectedType = FALLBACK_TYPES[0];
  var setupMode = 'pin';
  var editing = null;
  var edited = false;
  var sending = false;

  /* ------------------------------------------------------------ storage */
  function load(key, fallback) {
    try { return Object.assign({}, fallback, JSON.parse(localStorage.getItem(key) || '{}')); }
    catch (e) { return fallback; }
  }
  function save(key, value) {
    try { localStorage.setItem(key, JSON.stringify(value)); } catch (e) {}
  }
  function queue() {
    try { return JSON.parse(localStorage.getItem(QUEUE) || '[]'); } catch (e) { return []; }
  }
  function setQueue(items) {
    try { localStorage.setItem(QUEUE, JSON.stringify(items)); } catch (e) {}
    renderQueue();
  }

  /* ----------------------------------------------------------- helpers */
  function peso(value) {
    if (value === null || value === undefined || isNaN(value)) return '—';
    var sign = value < 0 ? '-' : '';
    return sign + '₱' + Math.abs(value).toLocaleString('en-PH', { maximumFractionDigits: 2 });
  }
  function signed(value) {
    return (value > 0 ? '+' : value < 0 ? '\u2212' : '') + peso(Math.abs(value));
  }

  function todayISO() {
    var d = new Date();
    return new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10);
  }
  function uuid() {
    return 'x-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 10);
  }
  var toastTimer;
  function toast(message, kind) {
    var el = $('toast');
    el.textContent = message;
    el.className = 'toast ' + (kind || '');
    el.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { el.hidden = true; }, kind === 'err' ? 7000 : 4000);
  }
  function show(section) {
    ['setup', 'app', 'recent', 'settings'].forEach(function (id) { $(id).hidden = id !== section; });
    $('submitBar').hidden = section !== 'app';
  }

  /* -------------------------------------------------------------- wire */
  function direct() { return settings.mode === 'direct'; }

  function call(payload) {
    var target = direct() ? settings.url : PROXY;
    var body = direct()
      ? Object.assign({ token: settings.secret }, payload)
      : Object.assign({ pin: settings.pin }, payload);
    return fetch(target, {
      method: 'POST',
      // Going straight to Apps Script, text/plain keeps this a simple request so
      // the browser skips the CORS preflight that Apps Script cannot answer.
      headers: { 'Content-Type': direct() ? 'text/plain;charset=utf-8' : 'application/json' },
      body: JSON.stringify(body),
      redirect: 'follow'
    }).then(function (res) {
      return res.text().then(function (text) {
        var data;
        try {
          data = JSON.parse(text);
        } catch (e) {
          if (!direct()) throw fail('This page has no server behind it.', 'no-proxy');
          throw new Error('The script did not return JSON. Check that the deployment allows access to "Anyone".');
        }
        if (!data.ok) throw fail(data.error || 'The request was rejected.', data.needPin ? 'need-pin' : '');
        return data;
      });
    });
  }

  function fail(message, code) {
    var error = new Error(message);
    error.code = code || '';
    return error;
  }

  /* ------------------------------------------------------------ config */
  function loadConfig() {
    $('sheetLine').textContent = 'Loading…';
    return call({ action: 'config' }).then(function (data) {
      config = data;
      if (!settings.sheet || data.sheets.indexOf(settings.sheet) === -1) settings.sheet = '';
      renderConfig();
      flushQueue(true);
    }).catch(function (err) {
      $('sheetLine').textContent = 'Offline — entries will be queued';
      toast(err.message, 'err');
    });
  }

  function renderConfig() {
    if (!config) return;
    var neg = function (el, value) { el.classList.toggle('neg', typeof value === 'number' && value < 0); };
    $('balCash').textContent = peso(config.balances.cash);
    $('balEmoney').textContent = peso(config.balances.emoney);
    neg($('balCash'), config.balances.cash);
    neg($('balEmoney'), config.balances.emoney);
    $('sheetLine').textContent = (settings.sheet || config.activeSheet) + ' · ' + config.rowsUsed + ' rows';
    $('sheetTitle').textContent = 'Add record';

    renderTypes(config.types && config.types.length ? config.types : FALLBACK_TYPES);

    var list = $('customerList');
    list.innerHTML = '';
    (config.customers || []).forEach(function (name) {
      var option = document.createElement('option');
      option.value = name;
      list.appendChild(option);
    });

    var chips = $('customerChips');
    chips.innerHTML = '';
    (config.customers || []).slice(0, 6).forEach(function (name) {
      var chip = document.createElement('button');
      chip.type = 'button';
      chip.className = 'chip';
      chip.textContent = name;
      chip.addEventListener('click', function () { $('customer').value = name; });
      chips.appendChild(chip);
    });

    var select = $('cfgSheet');
    select.innerHTML = '<option value="">Auto (' + config.activeSheet + ')</option>';
    (config.sheets || []).forEach(function (name) {
      var option = document.createElement('option');
      option.value = name;
      option.textContent = name;
      if (name === settings.sheet) option.selected = true;
      select.appendChild(option);
    });
    updatePreview();
  }

  function renderTypes(types) {
    var seg = $('typeSeg');
    seg.innerHTML = '';
    if (types.indexOf(selectedType) === -1) selectedType = types[0];
    types.forEach(function (type) {
      var button = document.createElement('button');
      button.type = 'button';
      button.textContent = type;
      button.setAttribute('aria-pressed', String(type === selectedType));
      button.addEventListener('click', function () {
        selectedType = type;
        Array.prototype.forEach.call(seg.children, function (child) {
          child.setAttribute('aria-pressed', String(child === button));
        });
        applySuggestion(false);
        updatePreview();
      });
      seg.appendChild(button);
    });
  }

  /* ---------------------------------------------------------- preview */
  function estimateFee(amount) {
    if (!amount || amount <= 0) return null;
    if (selectedType === 'Fund In' || selectedType === 'Expense') return 0;
    if (selectedType === 'Load') return 5;
    var card = (config && config.rateCard) || [];
    for (var i = 0; i < card.length; i++) {
      if (amount >= card[i].min && amount <= card[i].max) return card[i].fee;
    }
    if (card.length) {
      var top = card[card.length - 1];
      if (amount > top.max) return Math.round(amount * 0.02 - 10);
    }
    return null;
  }

  function amountValue() {
    var raw = $('amount').value.replace(/[^0-9.]/g, '');
    var value = parseFloat(raw);
    return isFinite(value) ? value : 0;
  }

  /* ------------------------------------------------- cash / e-money change */

  function signOf(id) { return $(id).getAttribute('data-sign') === '-' ? -1 : 1; }

  function setSign(id, sign) {
    $(id).setAttribute('data-sign', sign < 0 ? '-' : '+');
    $(id).textContent = sign < 0 ? '\u2212' : '+';
  }

  /** The signed number in a field, or null when it is blank. */
  function changeValue(inputId, signId) {
    var raw = $(inputId).value.replace(/[^0-9.]/g, '');
    if (!raw) return null;
    var value = parseFloat(raw);
    return isFinite(value) ? signOf(signId) * value : null;
  }

  function setChange(inputId, signId, value) {
    if (value === null) { $(inputId).value = ''; setSign(signId, 1); return; }
    setSign(signId, value < 0 ? -1 : 1);
    $(inputId).value = String(Math.abs(value));
  }

  /**
   * A starting point for the two change columns, assuming the fee is collected
   * in cash. When it comes out of the wallet instead, the numbers get edited by
   * hand — which is the whole reason these fields exist.
   */
  function suggestChanges() {
    var amount = amountValue();
    if (!amount) return { cash: null, emoney: null };
    var fee = estimateFee(amount) || 0;
    switch (selectedType) {
      case 'Cash In':  return { cash: amount + fee, emoney: -amount };
      case 'Cash Out': return { cash: -(amount - fee), emoney: amount };
      case 'Fund In':  return { cash: 0, emoney: amount };
      case 'Load':     return { cash: amount + fee, emoney: -amount };
      case 'Expense':  return { cash: -amount, emoney: 0 };
      default:         return { cash: null, emoney: null };
    }
  }

  function applySuggestion(force) {
    if (edited && !force) return;
    var suggested = suggestChanges();
    setChange('cashChange', 'cashSign', suggested.cash);
    setChange('emoneyChange', 'emoneySign', suggested.emoney);
    if (force) edited = false;
  }

  function updatePreview() {
    var amount = amountValue();
    var el = $('preview');
    if (!amount) { el.textContent = 'Enter an amount to see the fee.'; return; }
    var fee = estimateFee(amount);
    var line = selectedType + ' of <b>' + peso(amount) + '</b>';
    line += fee === null ? ' · fee computed by the sheet'
          : fee === 0 ? ' · no fee'
          : ' · fee <b>' + peso(fee) + '</b>';

    var cash = changeValue('cashChange', 'cashSign');
    var emoney = changeValue('emoneyChange', 'emoneySign');
    var written = [];
    if (cash !== null) written.push('cash <b>' + signed(cash) + '</b>');
    if (emoney !== null) written.push('e-money <b>' + signed(emoney) + '</b>');
    el.innerHTML = line + '<br><span class="tiny muted">' + (written.length
      ? written.join(' · ')
      : 'Cash and e-money left to the spreadsheet’s formulas.') + '</span>';
  }

  /* ------------------------------------------------- recent + editing */

  function openRecent() {
    show('recent');
    $('recentList').textContent = 'Loading…';
    call({ action: 'list', sheet: settings.sheet || '', limit: 25 }).then(function (data) {
      renderRecent(data.rows || []);
    }).catch(function (err) {
      $('recentList').textContent = err.message;
    });
  }

  function renderRecent(rows) {
    var list = $('recentList');
    list.innerHTML = '';
    if (!rows.length) { list.textContent = 'No records on this sheet yet.'; return; }
    list.className = '';
    rows.forEach(function (row) {
      var entry = document.createElement('button');
      entry.type = 'button';
      entry.className = 'entry';
      entry.innerHTML =
        '<span><span class="who">' + escapeHtml(row.type + (row.customer ? ' · ' + row.customer : '')) + '</span>' +
        '<span class="when">' + escapeHtml(row.date) + ' · row ' + row.row + (row.notes ? ' · ' + escapeHtml(row.notes) : '') + '</span></span>' +
        '<span class="money"><span class="amount">' + peso(row.amount) + '</span>' +
        '<div class="when">' + (row.fee ? 'fee ' + peso(row.fee) : 'no fee') + '</div></span>';
      entry.addEventListener('click', function () { editRecord(row); });
      list.appendChild(entry);
    });
  }

  function escapeHtml(text) {
    return String(text).replace(/[&<>"]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
    });
  }

  /** Load a record into the form and switch to editing it. */
  function editRecord(row) {
    editing = {
      sheet: row.sheet || settings.sheet || (config && config.activeSheet) || '',
      row: row.row,
      expect: { date: row.date, amount: row.amount, customer: row.customer || '' }
    };
    selectedType = row.type;
    // The record's own type must stay selectable even if it isn't in the
    // currently-loaded type list (e.g. a one-off category not seen recently) —
    // otherwise renderTypes silently falls back to types[0] and Save would
    // overwrite the row with the wrong type.
    var types = (config && config.types && config.types.length ? config.types : FALLBACK_TYPES).slice();
    if (row.type && types.indexOf(row.type) === -1) types.push(row.type);
    renderTypes(types);
    $('amount').value = row.amount === null ? '' : String(row.amount);
    $('customer').value = row.customer || '';
    $('date').value = row.date || todayISO();
    $('notes').value = row.notes || '';

    // A cell the sheet still calculates stays blank here, with its current
    // value shown behind the cursor — typing is what freezes it into a number.
    [['cashChange', 'cashSign', row.cashChange], ['emoneyChange', 'emoneySign', row.emoneyChange]]
      .forEach(function (field) {
        var cell = field[2] || { value: null, calculated: false };
        if (cell.calculated) {
          setChange(field[0], field[1], null);
          $(field[0]).placeholder = cell.value === null ? 'calculated' : String(cell.value);
        } else {
          $(field[0]).placeholder = '';
          setChange(field[0], field[1], cell.value);
        }
      });

    edited = true; // never overwrite a loaded record with a suggestion
    setEditMode();
    updatePreview();
    show('app');
  }

  function setEditMode() {
    var on = !!editing;
    $('editBanner').hidden = !on;
    $('sheetTitle').textContent = on ? 'Edit record' : 'Add record';
    $('submit').textContent = on ? 'Save changes' : 'Add record';
    if (on) $('editRowLabel').textContent = editing.sheet + ' row ' + editing.row;
  }

  function stopEditing() {
    editing = null;
    setEditMode();
    resetForm();
  }

  function removeRecord() {
    if (!editing) return;
    if (!confirm('Delete ' + editing.sheet + ' row ' + editing.row + '? The rows below shift up.')) return;
    var request = {
      action: 'delete', clientId: uuid(), sheet: editing.sheet,
      row: editing.row, expect: editing.expect
    };
    $('deleteRecord').disabled = true;
    call(request).then(function (data) {
      stopEditing();
      toast('Deleted ' + data.sheet + ' row ' + data.row + '.', 'ok');
      loadConfig();
    }).catch(function (err) {
      toast(err.message, 'err');
    }).then(function () {
      $('deleteRecord').disabled = false;
    });
  }

  /* ----------------------------------------------------------- submit */
  function submit() {
    if (sending) return;
    var amount = amountValue();
    if (!amount) { toast('Enter an amount first.', 'err'); $('amount').focus(); return; }
    if (!$('date').value) { toast('Pick a date.', 'err'); return; }

    var record = {
      action: editing ? 'update' : 'append',
      clientId: uuid(),
      date: $('date').value,
      type: selectedType,
      customer: $('customer').value.trim(),
      amount: amount,
      cashChange: changeValue('cashChange', 'cashSign'),
      emoneyChange: changeValue('emoneyChange', 'emoneySign'),
      notes: $('notes').value.trim(),
      sheet: editing ? editing.sheet : (settings.sheet || '')
    };
    if (editing) {
      record.row = editing.row;
      record.expect = editing.expect;
    }

    var wasEditing = !!editing;
    sending = true;
    $('submit').disabled = true;
    $('submit').textContent = 'Saving…';

    call(record).then(function (data) {
      config = config || { balances: {} };
      config.balances = data.balances;
      if (!wasEditing) config.rowsUsed = (config.rowsUsed || 0) + 1;
      renderConfig();
      stopEditing();
      toast((wasEditing ? 'Updated ' : 'Saved to ') + data.sheet + ' row ' + data.row +
            (data.fee ? ' · fee ' + peso(data.fee) : '') +
            ' · cash ' + peso(data.balances.cash) + ' · e-money ' + peso(data.balances.emoney), 'ok');
      loadConfig();
    }).catch(function (err) {
      // Only new records are safe to hold and retry. An edit is tied to a row
      // number that may not mean the same thing later.
      if (wasEditing) { toast(err.message, 'err'); return; }
      var pending = queue();
      pending.push(record);
      setQueue(pending);
      resetForm();
      toast('Not sent (' + err.message + ') — saved on this phone, will retry.', 'warn');
    }).then(function () {
      sending = false;
      $('submit').disabled = false;
      setEditMode();
    });
  }

  function resetForm() {
    $('amount').value = '';
    $('customer').value = '';
    $('notes').value = '';
    $('date').value = todayISO();
    $('cashChange').placeholder = '';
    $('emoneyChange').placeholder = '';
    edited = false;
    applySuggestion(true);
    updatePreview();
  }

  /* ------------------------------------------------------------ queue */
  function renderQueue() {
    var pending = queue();
    $('queueCard').hidden = pending.length === 0;
    $('queueCount').textContent = pending.length;
  }

  function flushQueue(quiet) {
    var pending = queue();
    if (!pending.length) return Promise.resolve();
    var record = pending[0];
    return call(record).then(function () {
      setQueue(queue().slice(1));
      return flushQueue(quiet);
    }).then(function () {
      if (!queue().length) {
        if (!quiet) toast('Queued records sent.', 'ok');
        loadConfig();
      }
    }).catch(function (err) {
      if (!quiet) toast('Still cannot reach the script: ' + err.message, 'err');
    });
  }

  /* ------------------------------------------------------------- boot */
  function bindEvents() {
    $('setupSave').addEventListener('click', function () {
      if (setupMode === 'direct') {
        var url = $('setupUrl').value.trim();
        if (!/^https:\/\/script\.google\.com\/.*\/exec$/.test(url)) {
          toast('That does not look like a Web App /exec URL.', 'err');
          return;
        }
        settings.mode = 'direct';
        settings.url = url;
        settings.secret = $('setupSecret').value.trim();
      } else {
        var pin = $('setupPinInput').value.trim();
        if (!pin) { toast('Enter the PIN.', 'err'); return; }
        settings.mode = 'proxy';
        settings.pin = pin;
      }
      $('setupSave').disabled = true;
      call({ action: 'config' }).then(function (data) {
        save(STORE, settings);
        config = data;
        show('app');
        renderConfig();
        flushQueue(true);
      }).catch(function (err) {
        settings.mode = '';
        toast(err.code === 'need-pin' ? 'That PIN was not accepted.' : err.message, 'err');
      }).then(function () {
        $('setupSave').disabled = false;
      });
    });


    $('openSettings').addEventListener('click', function () {
      $('cfgUrl').value = settings.url;
      $('cfgSecret').value = settings.secret;
      $('cfgPin').value = settings.pin;
      $('cfgPinField').hidden = direct();
      $('cfgDirectFields').hidden = !direct();
      $('cfgConnection').textContent = 'Sent through this site\u2019s server, which holds the script URL and secret.';
      show('settings');
    });
    $('closeSettings').addEventListener('click', function () { show('app'); });

    $('cfgSave').addEventListener('click', function () {
      if (direct()) {
        settings.url = $('cfgUrl').value.trim();
        settings.secret = $('cfgSecret').value.trim();
      } else {
        settings.pin = $('cfgPin').value.trim();
      }
      settings.sheet = $('cfgSheet').value;
      save(STORE, settings);
      show('app');
      loadConfig();
    });

    $('cfgForget').addEventListener('click', function () {
      if (!confirm('Remove the saved URL and secret from this phone?')) return;
      localStorage.removeItem(STORE);
      settings = { mode: '', url: '', secret: '', pin: '', sheet: '' };
      detect();
    });

    $('refresh').addEventListener('click', function () { loadConfig(); });
    $('openRecent').addEventListener('click', openRecent);
    $('closeRecent').addEventListener('click', function () { show('app'); });
    $('cancelEdit').addEventListener('click', stopEditing);
    $('deleteRecord').addEventListener('click', removeRecord);
    $('submit').addEventListener('click', submit);
    $('amount').addEventListener('input', function () {
      applySuggestion(false);
      updatePreview();
    });

    ['cashChange', 'emoneyChange'].forEach(function (id) {
      $(id).addEventListener('input', function () { edited = true; updatePreview(); });
    });

    [['cashSign', 'cashChange'], ['emoneySign', 'emoneyChange']].forEach(function (pair) {
      $(pair[0]).addEventListener('click', function () {
        setSign(pair[0], -signOf(pair[0]));
        edited = true;
        updatePreview();
      });
    });

    $('autoChanges').addEventListener('click', function () {
      applySuggestion(true);
      updatePreview();
    });
    $('todayBtn').addEventListener('click', function () { $('date').value = todayISO(); });
    $('queueRetry').addEventListener('click', function () { flushQueue(false); });
    $('queueClear').addEventListener('click', function () {
      if (confirm('Discard the records waiting to send?')) setQueue([]);
    });

    var chips = $('amountChips');
    AMOUNT_CHIPS.forEach(function (value) {
      var chip = document.createElement('button');
      chip.type = 'button';
      chip.className = 'chip';
      chip.textContent = peso(value);
      chip.addEventListener('click', function () {
        $('amount').value = String(value);
        applySuggestion(false);
        updatePreview();
      });
      chips.appendChild(chip);
    });

    $('form').addEventListener('submit', function (event) { event.preventDefault(); submit(); });
    window.addEventListener('online', function () { flushQueue(true); });
  }

  /**
   * Decide how this page reaches the spreadsheet. A deployment with the
   * serverless proxy needs only a PIN; a plain static host (GitHub Pages, a
   * local file) falls back to the Apps Script URL typed on the phone.
   */
  function detect() {
    settings.mode = 'proxy';
    settings.pin = settings.pin || '';
    call({ action: 'config' }).then(function (data) {
      save(STORE, settings);
      config = data;
      show('app');
      renderConfig();
      flushQueue(true);
    }).catch(function (err) {
      settings.mode = '';
      showSetup(err.code === 'no-proxy' ? 'direct' : 'pin');
      // A server that is reachable but misconfigured has something to say —
      // "SCRIPT_URL is not set", say. Silently showing the PIN box hides it.
      if (err.code !== 'no-proxy' && err.code !== 'need-pin') toast(err.message, 'err');
    });
  }

  function showSetup(mode) {
    setupMode = mode;
    var pin = mode === 'pin';
    $('setupPin').hidden = !pin;
    $('setupDirect').hidden = pin;
    $('setupTitle').textContent = pin ? 'Enter your PIN' : 'Connect your tracker';
    $('setupHelp').textContent = pin
      ? ''
      : 'This page has no server behind it, so it talks to Apps Script directly. Deployment steps are in the README.';
    show('setup');
  }

  bindEvents();
  renderTypes(FALLBACK_TYPES);
  renderQueue();
  $('date').value = todayISO();
  if (settings.mode) { show('app'); loadConfig(); } else { detect(); }

  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').catch(function () {});
  }
})();
</script>
</body>
</html>
